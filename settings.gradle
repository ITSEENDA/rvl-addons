pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'fabric-loom' version '1.13.6'
		id 'org.jetbrains.kotlin.jvm' version '2.1.20'
	}
}

rootProject.name = 'rvl-addons'

include ':common'
include ':targets:fabric:1_20_4'
include ':targets:fabric:1_21_1'

project(':targets:fabric:1_20_4').projectDir = file('targets/fabric/1.20.4')
project(':targets:fabric:1_21_1').projectDir = file('targets/fabric/1.21.1')
